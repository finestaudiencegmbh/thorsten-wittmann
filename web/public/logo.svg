<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- hintere Raute: schwarz, leicht nach unten-links versetzt -->
  <rect x="20.5" y="20.5" width="55" height="55" transform="rotate(45 48 52)" fill="none" stroke="#111111" stroke-width="5"/>
  <!-- vordere Raute: gold, leicht nach oben-rechts versetzt -->
  <rect x="24.5" y="24.5" width="55" height="55" transform="rotate(45 52 48)" fill="none" stroke="#d0bb5a" stroke-width="5"/>
  <!-- mm in Gold -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34"
        letter-spacing="-1" fill="#d0bb5a">mm</text>
</svg>

# Render.com Blueprint – Ein-Klick-Deployment des Dashboards.
# Schritt-fuer-Schritt-Anleitung: TEMPLATE.md
#
# Werte mit "sync: false" fragt Render beim Deploy ab und speichert sie NICHT
# im Repo. Genau dort gehoeren alle Secrets hin (Tokens, Passwoerter, der
# Google-Service-Account-Key).

services:
  - type: web
    name: thorsten-wittmann-dashboard
    runtime: node
    plan: free
    # devDependencies (vite) werden für den Build gebraucht -> explizit mitinstallieren
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # ID des Tracking-Sheets (steht in der Sheet-URL zwischen /d/ und /edit).
      - key: SPREADSHEET_ID
        value: 1uWpRJgQXB0mWBLcBuZegpKvauRG4pOV8YaABzkcNMUY
      - key: CACHE_TTL_SECONDS
        value: "900"
      # --- KI-Chatbot (optional) – Anthropic-API-Key ---
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Login (teilbare URL + Passwort) – beim Deploy ausfüllen ---
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # --- Google-Service-Account als kompletter JSON-Key (eine Zeile) ---
      # Leer lassen = Demo-Modus. Sobald gesetzt -> echte Sheet-Daten live.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # --- Facebook-Ads direkt via Meta Marketing API – optional, leer = aus ---
      # Hat Vorrang vor Supermetrics, wenn gesetzt.
      - key: META_ACCESS_TOKEN
        sync: false
      # Ad-Account inkl. "act_"-Praefix.
      - key: META_AD_ACCOUNT_ID
        value: act_799222403469426
      # --- Facebook-Ads via Supermetrics – optional, leer = aus ---
      - key: SUPERMETRICS_API_KEY
        sync: false
      - key: SUPERMETRICS_DS_ACCOUNTS
        sync: false
      - key: SUPERMETRICS_DS_USER
        sync: false
      - key: SUPERMETRICS_QUERY_JSON
        sync: false
